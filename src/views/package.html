<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ซื้อแพ็กเก็จยิงโค้ด</title>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/css/package.css" />

  <!-- SweetAlert2 -->
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* ========== Modal Style ========== */
    #modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1050;
    }
    #modal.modal-open {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .swal2-container {
      z-index: 2000 !important;
    }

    /* ========== Site Selector ========== */
    .site-selector {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 15px 0;
    }
    .site-option {
      width: 100px;
      height: 60px;
      border: 2px solid transparent;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: 0.3s;
    }
    .site-option img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
      padding: 5px;
    }
    .site-option.active {
      border-color: #0088cc;
      box-shadow: 0 0 10px rgba(0, 136, 204, 0.5);
    }

    /* ========== Multiple Users Input ========== */
    .user-list {
      margin-top: 10px;
    }
    .user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .user-item input {
      flex: 1;
    }
    .user-item .count-input {
      width: 60px;
    }
    .remove-user-btn {
      background: #ff4e4e;
      border: none;
      color: white;
      border-radius: 5px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .add-user-btn {
      background: #0088cc;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 6px 12px;
      margin-top: 5px;
      cursor: pointer;
    }
    .highlight {
      font-weight: bold;
      color: #0088cc;
    }
  </style>
</head>

<body>
  <h1>เลือกแพ็กเกจสุดคุ้ม</h1>
  <div class="package-grid" id="packageGrid"></div>

  <!-- Modal -->
  <div id="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeModalBtn" role="button">&times;</span>
      <h2>รายละเอียดการชำระเงิน</h2>

      <p id="selected-package" class="highlight"></p>
      <p>ชื่อบัญชี: <strong>นาย มนัสชัย แสงจันทร์ดาว</strong></p>
      <p>
        ธนาคาร: <strong>กสิกรไทย</strong> |
        เลขบัญชี: <strong id="bankAccount">222-8-55787-3</strong>
        <button onclick="copyAccount()" class="copy-btn">📋</button>
        <span id="copyStatus" class="copy-status"></span>
      </p>
      <p>จำนวนเงินที่ต้องชำระ: <span id="selected-price" class="highlight"></span> บาท</p>

      <!-- Site Selection -->
      <h3>เลือกเว็บไซต์:</h3>
      <div class="site-selector" id="siteSelector">
        <div class="site-option active" data-site="jun88">
          <img src="/images/logo-jun88.png" alt="Jun88" />
        </div>
        <div class="site-option" data-site="789bet">
          <img src="/images/logo-789bet.png" alt="789Bet" />
        </div>
      </div>

      <!-- Multiple Users -->
      <h3>ยูสเซอร์ที่จะรับโค้ด:</h3>
      <p>กรอกข้อมูล : ยูสเซอร์/จำนวนโค้ด</p>
      <div id="userList" class="user-list"></div>
      <button class="add-user-btn" onclick="addUserInput()">➕ เพิ่มยูสเซอร์</button>

      <!-- Slip Upload -->
      <div class="slip-upload-container">
        <label for="slipInput" class="upload-label">📎 แนบสลิปการโอน</label>
        <input type="file" id="slipInput" accept="image/*" onchange="handleSlipChange()" />
        <span id="slipFileName">ยังไม่ได้เลือกไฟล์</span>
        <img id="slipPreview" src="" alt="Preview สลิป" style="display:none; max-width:100%; margin-top:10px;" />
      </div>

      <!-- Telegram Notify -->
      <div class="customer-receive-notif">
        <label>
          <input type="checkbox" id="telegramNotify" onchange="toggleTelegramInput()" />
          ต้องการรับแจ้งเตือนผ่าน Telegram
        </label>
        <div id="telegramInputGroup" style="display:none;">
          <input type="text" id="telegramId" placeholder="กรอก Telegram Chat ID" />
        </div>
      </div>

      <p id="loadingStatus" style="display:none;"><span class="loader"></span> กำลังส่งข้อมูล...</p>
      <button id="submitPaymentBtn" class="receive-btn">ยืนยันการชำระเงิน</button>
    </div>
  </div>

<script src="/js/package.js"></script>
</body>
</html>
